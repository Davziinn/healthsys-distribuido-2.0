server:
  port: 8083

spring:
  application:
    name: Servico-Prontuario

  mongodb:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:27018}
    database: db_prontuarios-healthsys
#      username: adm
#      password: adm
#      authentication-database: admin

services:
  pacientes:
    url: http://${PACIENTES_HOST:localhost}:${PACIENTES_PORT:8082}

resilience4j:
  circuitbreaker:
    instances:
      pacientes-service:
        sliding-window-size: 10          # avalia as últimas 10 chamadas
        minimum-number-of-calls: 5       # só decide algo depois de pelo menos 5 chamadas
        failure-rate-threshold: 50       # se 50%+ falharem, abre o circuito
        wait-duration-in-open-state: 10s # fica "aberto" (rejeitando na hora) por 10s antes de testar de novo
        permitted-number-of-calls-in-half-open-state: 3

  retry:
    instances:
      pacientes-service:
        max-attempts: 3                  # tenta a chamada original + 2 retries
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2 # 500ms, depois 1s, depois 2s