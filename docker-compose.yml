services:

  postgres-usuarios:
    image: postgres:16
    container_name: healthSys-servico-usuarios
    environment:
      POSTGRES_DB: db_usuario-healthsys
      POSTGRES_USER: adm
      POSTGRES_PASSWORD: adm
    ports:
      - "5433:5432"
    volumes:
      - healthSys_usu_data:/var/lib/postgresql/data
    networks:
      - healthsys-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adm" ]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-pacientes:
    image: postgres:16
    container_name: healthSys-servico-pacientes
    environment:
      POSTGRES_DB: db_pacientes-healthsys
      POSTGRES_USER: adm
      POSTGRES_PASSWORD: adm
    ports:
      - "5432:5432"
    volumes:
      - healthSys_pac_data:/var/lib/postgresql/data
    networks:
      - healthsys-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adm" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: healthSys-servico-prontuario
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - healthsys-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5

  servico-usuarios:
    build: ./Servico-Usuarios
    container_name: servico-usuarios
    environment:
      DB_HOST: postgres-usuarios
    depends_on:
      postgres-pacientes:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - healthsys-net

  servico-pacientes:
    build: ./Servico-Pacientes
    container_name: servico-pacientes
    environment:
      DB_HOST: postgres-pacientes
    depends_on:
      postgres-pacientes:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - healthsys-net

  servico-prontuario:
    build: ./Servico-Prontuario
    container_name: servico-prontuario
    environment:
      DB_HOST: mongodb
      DB_PORT: 27017
      PACIENTES_HOST: servico-pacientes
      PACIENTES_PORT: "8080"
    depends_on:
      postgres-pacientes:
        condition: service_healthy
    ports:
      - "8083:8080"
    networks:
      - healthsys-net


  rabbitmq:
    image: rabbitmq:3-management
    container_name: healthSys-rabbitmq
    ports:
      - "5672:5672"    # porta que sua aplicação Java vai usar pra conectar
      - "15672:15672"  # porta da interface web de management
    environment:
      RABBITMQ_DEFAULT_USER: adm
      RABBITMQ_DEFAULT_PASS: adm
    networks:
      - healthsys-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: healthSys-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - healthsys-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: healthSys-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: healthsys
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - healthsys-net

volumes:
  healthSys_usu_data:
  healthSys_pac_data:
  mongo_data:

networks:
  healthsys-net:
    driver: bridge