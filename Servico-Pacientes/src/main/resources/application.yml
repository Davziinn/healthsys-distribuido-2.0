server:
  port: 8082

spring:
  application:
    name: Servico-Pacientes

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/db_pacientes-healthsys
    username: adm
    password: adm
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Opcoes: update, create, create-drop, validate, none
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  usuarios:
    url: http://${USUARIOS_HOST:localhost}:${USUARIOS_PORT:8081}

resilience4j:
  circuitbreaker:
    instances:
      usuarios-service:
        slinding-window-size: 10
        minimum-number-of-call: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

  retry:
    instances:
      usuarios-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2